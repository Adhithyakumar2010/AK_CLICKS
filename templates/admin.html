<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio login | AK CLICKS</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}"></head><body><main><a class="back" href="{{ url_for('home') }}">← Back to site</a><section class="login-box"><p>AK CLICKS</p><h1>Studio login</h1><form method="post"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<small>{{ message }}</small>{% endfor %}{% endwith %}<button type="submit">Sign in</button></form></section></main></body></html>
