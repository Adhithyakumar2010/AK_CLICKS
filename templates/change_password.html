<!doctype html>
<html>

<head>

<title>Change Password</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

<h1>Change Password</h1>

<form method="POST">

<label>Current Password</label>

<input
type="password"
name="current_password"
required>

<br><br>

<label>New Password</label>

<input
type="password"
name="new_password"
required>

<br><br>

<label>Confirm Password</label>

<input
type="password"
name="confirm_password"
required>

<br><br>

<button class="button">

Update Password

</button>

</form>

<br>

<a href="{{ url_for('customer_profile') }}"
class="button">

Back

</a>

</div>

</body>

</html>
