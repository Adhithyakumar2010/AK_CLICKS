<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password | AK CLICKS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="auth-brand" href="{{ url_for('home') }}">AK <span>CLICKS</span></a>
    <p class="eyebrow">Account security</p>
    <h1>Reset Password</h1>
    <p class="auth-intro">Please enter your new password below. It must be at least 8 characters long.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="form-message {{ category }}">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    <form method="post" action="{{ url_for('reset_password', token=token) }}" class="auth-form">
      <label>New Password
        <input type="password" name="new_password" autocomplete="new-password" minlength="8" required>
      </label>
      <label>Confirm Password
        <input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required>
      </label>
      <button class="button" type="submit">Update Password <span>&rarr;</span></button>
    </form>
    <div class="auth-links">
      <a class="auth-secondary-button" href="{{ url_for('customer_login') }}">&larr; Back to Login</a>
    </div>
  </main>
</body>
</html>
