<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Payment submitted | AK CLICKS</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="confirmation">

<main class="confirmation-card">

    <p class="eyebrow">AK CLICKS · TEST MODE</p>

    <h1>Payment submission received.</h1>

    <p>
        No payment was collected.
        In a live payment setup, we would now verify your transaction
        and send a confirmation.
    </p>

    <div class="confirmation-actions">

        <a href="{{ url_for('receipt', kind=kind, record_id=record_id) }}"
           class="button">
            Download test receipt
        </a>

        {% if kind == "booking" %}

            <a href="{{ url_for('home') }}"
               class="button secondary-button">
                Back to Home
            </a>

        {% else %}

            <a href="{{ url_for('shop') }}"
               class="button secondary-button">
                Back to Story Store
            </a>

        {% endif %}

    </div>

</main>

</body>
</html>
